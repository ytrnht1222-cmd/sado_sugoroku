<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佐渡すごろく</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #eef8ff;
    }

    #map {
        height: 100vh;
        width: 100%;
    }

    #gamePanel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        width: 280px;
        padding: 16px;
        background: rgba(255,255,255,0.96);
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.22);
    }

    #title {
        font-size: 25px;
        font-weight: 900;
        color: #124d82;
        text-align: center;
        margin-bottom: 10px;
    }

    #turnDisplay {
        padding: 10px;
        text-align: center;
        font-size: 20px;
        font-weight: 900;
        background: #fff0b8;
        border-radius: 12px;
        margin-bottom: 10px;
    }

    /* サイコロ表示エリア */
    #diceArea {
        height: 155px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 14px;
        background: linear-gradient(180deg, #edf9ff, #ffffff);
        margin-bottom: 10px;
    }

    #diceImage {
        width: 145px;
        height: 145px;
        object-fit: cover;
        border-radius: 22px;
        user-select: none;
        pointer-events: none;
        filter: drop-shadow(0 7px 6px rgba(0,0,0,0.18));
    }

    /* 振っている間の動き */
    .diceRolling {
        animation: diceRolling 0.18s infinite;
    }

    @keyframes diceRolling {
        0% {
            transform: rotate(-12deg) scale(0.94);
        }
        25% {
            transform: rotate(12deg) scale(1.05);
        }
        50% {
            transform: rotate(-8deg) scale(1.10);
        }
        75% {
            transform: rotate(10deg) scale(1.02);
        }
        100% {
            transform: rotate(-12deg) scale(0.94);
        }
    }

    /* 出目が決まった瞬間 */
    .diceResult {
        animation: diceResult 0.45s ease-out;
    }

    @keyframes diceResult {
        0% { transform: scale(0.85) rotate(-8deg); }
        60% { transform: scale(1.12) rotate(4deg); }
        100% { transform: scale(1) rotate(0deg); }
    }

    #diceButton {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: #ffc83d;
        color: #222;
        font-size: 19px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 3px 0 #d79d00;
        transition: 0.15s;
    }

    #diceButton:hover {
        transform: translateY(-2px);
        background: #ffd45d;
    }

    #diceButton:active {
        transform: translateY(2px);
        box-shadow: none;
    }

    #diceButton:disabled {
        background: #ccc;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
    }

    .playerRow {
        margin-top: 10px;
        padding: 9px 12px;
        border-radius: 11px;
        font-weight: bold;
    }

    .player1 { background: #ffe1e1; }
    .player2 { background: #e1eaff; }

    .space-number {
        background: white;
        border: 2px solid #333;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        text-align: center;
        line-height: 21px;
        font-size: 11px;
        font-weight: bold;
    }

    .landmark {
        background: #ffd34e;
        border: 3px solid #e59b00;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        text-align: center;
        line-height: 30px;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    .player-token {
        border-radius: 50%;
        width: 29px;
        height: 29px;
        border: 3px solid white;
        box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }

    .player1-token { background: #ef3340; }
    .player2-token { background: #1769d1; }

    @media (max-width: 700px) {
        #gamePanel {
            width: 235px;
            padding: 11px;
        }
        #title { font-size: 21px; }
        #turnDisplay { font-size: 17px; }
        #diceArea { height: 125px; }
        #diceImage { width: 115px; height: 115px; }
        #diceButton { font-size: 17px; }
    }
</style>
</head>

<body>

<div id="gamePanel">
    <div id="title">🏝️ 佐渡すごろく</div>

    <div id="turnDisplay">プレイヤー1のターン</div>

    <div id="diceArea">
        <img id="diceImage" src="images/dice1.png" alt="サイコロ">
    </div>

    <button id="diceButton">🎲 サイコロを振る</button>

    <div class="playerRow player1">🔴 プレイヤー1</div>
    <div class="playerRow player2">🔵 プレイヤー2</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================
   ① 地図
========================================= */

const map = L.map("map").setView([38.05, 138.38], 10);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* =========================================
   ② 40マス
========================================= */

const spaces = [
    {name:"両津港", lat:38.0776, lng:138.4396},
    {lat:38.0670, lng:138.4350},
    {lat:38.0570, lng:138.4300},
    {lat:38.0480, lng:138.4260},
    {name:"トキの森公園", lat:38.0405, lng:138.4230},
    {lat:38.0950, lng:138.4300},
    {lat:38.1400, lng:138.4350},
    {lat:38.1900, lng:138.4450},
    {lat:38.2500, lng:138.4600},
    {name:"大野亀", lat:38.3260, lng:138.4730},
    {lat:38.2800, lng:138.4300},
    {lat:38.2200, lng:138.3900},
    {lat:38.1600, lng:138.3400},
    {lat:38.1000, lng:138.2900},
    {name:"佐渡金山", lat:38.0398, lng:138.2508},
    {lat:38.0300, lng:138.2650},
    {lat:38.0200, lng:138.2800},
    {lat:38.0100, lng:138.2950},
    {lat:38.0020, lng:138.3100},
    {name:"大膳神社", lat:37.9950, lng:138.3250},
    {lat:37.9920, lng:138.3370},
    {lat:37.9890, lng:138.3500},
    {lat:37.9870, lng:138.3620},
    {lat:37.9850, lng:138.3730},
    {name:"妙宣寺", lat:37.9828, lng:138.3840},
    {lat:37.9500, lng:138.3700},
    {lat:37.9100, lng:138.3500},
    {lat:37.8700, lng:138.3300},
    {lat:37.8350, lng:138.3050},
    {name:"小木港", lat:37.8068, lng:138.2815},
    {lat:37.8350, lng:138.3300},
    {lat:37.8700, lng:138.3700},
    {lat:37.9000, lng:138.4100},
    {lat:37.9350, lng:138.4600},
    {name:"岩首昇竜棚田", lat:37.9620, lng:138.5040},
    {lat:37.9850, lng:138.5200},
    {lat:38.0200, lng:138.5100},
    {lat:38.0500, lng:138.4900},
    {lat:38.0700, lng:138.4650},
    {name:"両津港（ゴール）", lat:38.0776, lng:138.4396}
];


/* =========================================
   ③ ルート
========================================= */

const route = spaces.map(space => [space.lat, space.lng]);

L.polyline(route, {
    color: "red",
    weight: 5,
    opacity: 0.75
}).addTo(map);


/* =========================================
   ④ マス表示
========================================= */

spaces.forEach((space, index) => {

    let icon;

    if (space.name) {
        icon = L.divIcon({
            className: "",
            html: `<div class="landmark">${index + 1}</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });
    } else {
        icon = L.divIcon({
            className: "",
            html: `<div class="space-number">${index + 1}</div>`,
            iconSize: [25, 25],
            iconAnchor: [12, 12]
        });
    }

    const marker = L.marker(
        [space.lat, space.lng],
        {icon: icon}
    ).addTo(map);

    if (space.name) {
        marker.bindTooltip(space.name, {
            permanent: true,
            direction: "top",
            offset: [0, -16]
        });
    }
});


/* =========================================
   ⑤ プレイヤー
========================================= */

const players = [
    {
        name: "プレイヤー1",
        position: 0,
        marker: null
    },
    {
        name: "プレイヤー2",
        position: 0,
        marker: null
    }
];

players.forEach((player, index) => {

    const icon = L.divIcon({
        className: "",
        html: `<div class="player-token player${index + 1}-token"></div>`,
        iconSize: [35, 35],
        iconAnchor: [17, 17]
    });

    player.marker = L.marker(
        [spaces[0].lat, spaces[0].lng],
        {
            icon: icon,
            zIndexOffset: 1000 + index
        }
    ).addTo(map);
});


/* =========================================
   ⑥ ゲーム状態
========================================= */

let currentPlayer = 0;

const diceImage = document.getElementById("diceImage");
const diceButton = document.getElementById("diceButton");
const turnDisplay = document.getElementById("turnDisplay");


/* =========================================
   ⑦ サイコロ画像を先読み
   最初の一回だけ読み込みが遅くなるのを防ぐ
========================================= */

const diceImages = [];

for (let i = 1; i <= 6; i++) {
    const image = new Image();
    image.src = `images/dice${i}.png`;
    diceImages.push(image);
}


/* =========================================
   ⑧ 待つ関数
========================================= */

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =========================================
   ⑨ ターン表示
========================================= */

function updateScreen() {
    turnDisplay.textContent =
        players[currentPlayer].name + "のターン";
}


/* =========================================
   ⑩ サイコロを振る
========================================= */

async function rollDice() {

    diceButton.disabled = true;

    diceImage.classList.remove("diceResult");
    diceImage.classList.add("diceRolling");

    /*
       6種類の画像を高速で切り替える
    */

    let imageNumber = 1;
    const startTime = Date.now();

    while (Date.now() - startTime < 1100) {

        diceImage.src = `images/dice${imageNumber}.png`;

        imageNumber++;

        if (imageNumber > 6) {
            imageNumber = 1;
        }

        await wait(90);
    }

    /* 本当の出目を決定 */

    const result = Math.floor(Math.random() * 6) + 1;

    /* 最終結果を表示 */

    diceImage.src = `images/dice${result}.png`;

    diceImage.classList.remove("diceRolling");

    /* 「ドン！」と止まる */

    void diceImage.offsetWidth;
    diceImage.classList.add("diceResult");

    await wait(600);

    return result;
}


/* =========================================
   ⑪ コマを1マスずつ移動
========================================= */

async function movePlayer(player, steps) {

    for (let i = 0; i < steps; i++) {

        if (player.position < spaces.length - 1) {
            player.position++;
        }

        const target = spaces[player.position];

        player.marker.setLatLng([
            target.lat,
            target.lng
        ]);

        await wait(300);
    }
}


/* =========================================
   ⑫ ランドマーク到着
========================================= */

function landmarkEffect(position) {

    const space = spaces[position];

    if (!space.name) return;

    alert("📍 " + space.name + " に到着！");
}


/* =========================================
   ⑬ サイコロボタン
========================================= */

diceButton.addEventListener("click", async () => {

    const player = players[currentPlayer];

    const result = await rollDice();

    console.log(player.name + "の出目：" + result);

    await movePlayer(player, result);

    landmarkEffect(player.position);

    /* ゴール */

    if (player.position === spaces.length - 1) {

        alert(
            "🎉 " +
            player.name +
            " が佐渡を1周しました！"
        );

        diceButton.disabled = true;
        return;
    }

    /* 次のプレイヤー */

    currentPlayer =
        (currentPlayer + 1) % players.length;

    updateScreen();

    diceButton.disabled = false;
});


/* =========================================
   ⑭ 初期表示
========================================= */

updateScreen();

</script>

</body>
</html>

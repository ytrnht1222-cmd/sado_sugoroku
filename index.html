<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佐渡すごろく</title>

<!-- Leaflet -->
<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================
   全体
========================= */

body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f5;
}


/* =========================
   マップ
========================= */

#map {
    height: 100vh;
    width: 100%;
}


/* =========================
   ゲーム画面
========================= */

#gamePanel {

    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 1000;

    background: white;

    padding: 15px;

    border-radius: 15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.25);

    width: 230px;
}


/* =========================
   タイトル
========================= */

#gameTitle {

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 10px;
}


/* =========================
   プレイヤー情報
========================= */

.playerRow {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 6px 0;

    padding: 6px;

    border-radius: 8px;

    background: #f2f2f2;
}


.playerColor {

    width: 18px;
    height: 18px;

    border-radius: 50%;
}


.player1Color {
    background: #e74c3c;
}

.player2Color {
    background: #3498db;
}

.player3Color {
    background: #2ecc71;
}

.player4Color {
    background: #f1c40f;
}


/* =========================
   ターン表示
========================= */

#turnDisplay {

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    margin: 10px 0;
}


/* =========================
   サイコロ
========================= */

#diceArea {

    text-align: center;

    margin: 10px 0;
}


#diceImage {

    width: 100px;
    height: 100px;

    object-fit: contain;

    display: block;

    margin: auto;
}


/* サイコロを振っているとき */

.diceRolling {

    animation: diceRoll 0.15s infinite;

}


@keyframes diceRoll {

    0% {
        transform:
            rotate(-12deg)
            scale(1);
    }

    50% {
        transform:
            rotate(12deg)
            scale(1.15);
    }

    100% {
        transform:
            rotate(-12deg)
            scale(1);
    }

}


/* 出目決定時 */

.diceResult {

    animation: diceResult 0.4s ease-out;

}


@keyframes diceResult {

    0% {
        transform: scale(0.7);
    }

    60% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   サイコロボタン
========================= */

#diceButton {

    width: 100%;

    padding: 12px;

    font-size: 18px;

    font-weight: bold;

    border: none;

    border-radius: 10px;

    background: #ffb300;

    color: white;

    cursor: pointer;
}


#diceButton:hover {

    background: #ff9800;

}


#diceButton:disabled {

    background: #aaa;

    cursor: not-allowed;

}


/* =========================
   マス番号
========================= */

.space-number {

    background: white;

    border: 2px solid #333;

    border-radius: 50%;

    width: 28px;
    height: 28px;

    line-height: 28px;

    text-align: center;

    font-weight: bold;
}


/* =========================
   ランドマーク
========================= */

.landmark {

    background: #fff3cd;

    border: 3px solid #d4a017;

    border-radius: 10px;

    padding: 4px 7px;

    font-weight: bold;

    white-space: nowrap;
}


/* =========================
   プレイヤーコマ
========================= */

.player-token {

    width: 26px;
    height: 26px;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.4);

}


/* プレイヤー色 */

.player1 {
    background: #e74c3c;
}

.player2 {
    background: #3498db;
}

.player3 {
    background: #2ecc71;
}

.player4 {
    background: #f1c40f;
}


/* =========================
   スタート画面
========================= */

#startScreen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(0,0,0,0.65);

    z-index: 5000;

    display: flex;

    justify-content: center;

    align-items: center;
}


#startBox {

    background: white;

    width: 360px;

    max-width: 90%;

    padding: 30px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);
}


#startBox h1 {

    margin-top: 0;

    font-size: 30px;
}


#startBox p {

    font-size: 18px;

    margin-bottom: 20px;
}


/* =========================
   人数選択
========================= */

.playerSelect {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}


.playerSelect button {

    padding: 15px;

    font-size: 20px;

    font-weight: bold;

    border: 3px solid #ddd;

    background: white;

    border-radius: 12px;

    cursor: pointer;
}


.playerSelect button:hover {

    background: #f5f5f5;

}


.playerSelect button.selected {

    border-color: #ff9800;

    background: #fff3cd;

}


/* ゲーム開始 */

#startButton {

    width: 100%;

    padding: 15px;

    font-size: 22px;

    font-weight: bold;

    border: none;

    border-radius: 12px;

    background: #ff9800;

    color: white;

    cursor: pointer;
}


#startButton:hover {

    background: #f57c00;

}


/* =========================
   メッセージ
========================= */

#message {

    text-align: center;

    font-size: 15px;

    margin-top: 8px;

    min-height: 40px;
}


/* =========================
   ゴール画面
========================= */

#goalScreen {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(0,0,0,0.7);

    z-index: 6000;

    justify-content: center;

    align-items: center;
}


#goalBox {

    background: white;

    padding: 35px;

    border-radius: 20px;

    text-align: center;

}


#goalBox h1 {

    font-size: 32px;

}


#restartButton {

    padding: 12px 25px;

    font-size: 18px;

    border: none;

    border-radius: 10px;

    background: #ff9800;

    color: white;

    cursor: pointer;
}


</style>
</head>


<body>


<!-- =========================
     スタート画面
========================= -->

<div id="startScreen">

    <div id="startBox">

        <h1>🏝️ 佐渡すごろく</h1>

        <p>
            何人で遊びますか？
        </p>

        <div class="playerSelect">

            <button
                data-players="2">
                👤 2人
            </button>

            <button
                data-players="3">
                👤 3人
            </button>

            <button
                data-players="4">
                👤 4人
            </button>

        </div>

        <button id="startButton">
            ゲームスタート！
        </button>

    </div>

</div>


<!-- =========================
     マップ
========================= -->

<div id="map"></div>


<!-- =========================
     ゲームパネル
========================= -->

<div id="gamePanel">

    <div id="gameTitle">
        🏝️ 佐渡すごろく
    </div>

    <div id="turnDisplay">
        プレイヤー1のターン
    </div>

    <div id="players">

        <!-- JavaScriptで生成 -->

    </div>


    <div id="diceArea">

        <img
            id="diceImage"
            src="images/dice1.png"
            alt="サイコロ">

    </div>


    <button id="diceButton">
        🎲 サイコロを振る
    </button>


    <div id="message">
        サイコロを振ってスタート！
    </div>

</div>


<!-- =========================
     ゴール画面
========================= -->

<div id="goalScreen">

    <div id="goalBox">

        <h1>🎉 ゴール！</h1>

        <p id="goalMessage"></p>

        <button id="restartButton">
            もう一度遊ぶ
        </button>

    </div>

</div>


<!-- Leaflet -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =================================================
   佐渡すごろく
================================================= */


/* =========================
   マップ
========================= */

const map = L.map("map")
    .setView([38.05, 138.38], 10);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* =========================
   40マス
========================= */

const spaces = [

    [38.0776,138.4396, "両津港"],

    [38.0670,138.4350, ""],

    [38.0570,138.4300, ""],

    [38.0480,138.4260, ""],

    [38.0405,138.4230, "トキの森公園"],

    [38.0950,138.4300, ""],

    [38.1400,138.4350, ""],

    [38.1900,138.4450, ""],

    [38.2500,138.4600, ""],

    [38.3260,138.4730, "大野亀"],

    [38.2800,138.4300, ""],

    [38.2200,138.3900, ""],

    [38.1600,138.3400, ""],

    [38.1000,138.2900, ""],

    [38.0398,138.2508, "佐渡金山"],

    [38.0300,138.2650, ""],

    [38.0200,138.2800, ""],

    [38.0100,138.2950, ""],

    [38.0020,138.3100, ""],

    [37.9950,138.3250, "大膳神社"],

    [37.9920,138.3370, ""],

    [37.9890,138.3500, ""],

    [37.9870,138.3620, ""],

    [37.9850,138.3730, ""],

    [37.9828,138.3840, "妙宣寺"],

    [37.9500,138.3700, ""],

    [37.9100,138.3500, ""],

    [37.8700,138.3300, ""],

    [37.8350,138.3050, ""],

    [37.8068,138.2815, "小木港"],

    [37.8350,138.3300, ""],

    [37.8700,138.3700, ""],

    [37.9000,138.4100, ""],

    [37.9350,138.4600, ""],

    [37.9620,138.5040, "岩首昇竜棚田"],

    [37.9850,138.5200, ""],

    [38.0200,138.5100, ""],

    [38.0500,138.4900, ""],

    [38.0700,138.4650, ""],

    [38.0776,138.4396, "両津港（ゴール）"]

];


/* =========================
   ルート
========================= */

const route = spaces.map(
    s => [s[0], s[1]]
);


L.polyline(
    route,
    {
        color: "red",
        weight: 4
    }
).addTo(map);


/* =========================
   マスを表示
========================= */

spaces.forEach(
    (space, index) => {

        const lat = space[0];
        const lng = space[1];
        const name = space[2];


        if (name) {

            L.marker(
                [lat, lng],
                {
                    icon:
                        L.divIcon({

                            className:
                                "landmark",

                            html:
                                name,

                            iconSize:
                                null

                        })
                }
            ).addTo(map);

        } else {

            L.marker(
                [lat, lng],
                {
                    icon:
                        L.divIcon({

                            className:
                                "space-number",

                            html:
                                index + 1,

                            iconSize:
                                [28, 28]

                        })
                }
            ).addTo(map);

        }

    }
);


/* =================================================
   プレイヤー人数
================================================= */

let playerCount = 2;


/* =========================
   プレイヤー選択
========================= */

const playerButtons =
    document.querySelectorAll(
        ".playerSelect button"
    );


playerButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                playerButtons.forEach(
                    b =>
                        b.classList.remove(
                            "selected"
                        )
                );

                button.classList.add(
                    "selected"
                );

                playerCount =
                    Number(
                        button.dataset.players
                    );

            }
        );

    }
);


/* =========================
   最初は2人を選択
========================= */

playerButtons[0]
    .classList.add("selected");


/* =================================================
   プレイヤーデータ
================================================= */

let players = [];

let currentPlayer = 0;


/* =========================
   ゲーム開始
========================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    players = [];

    currentPlayer = 0;


    /* プレイヤーを作る */

    for (
        let i = 0;
        i < playerCount;
        i++
    ) {

        players.push({

            position: 0,

            marker: null,

            name:
                "プレイヤー" +
                (i + 1)

        });

    }


    /* プレイヤー表示 */

    createPlayersUI();


    /* コマを作る */

    createPlayerMarkers();


    /* スタート画面を消す */

    document
        .getElementById("startScreen")
        .style.display = "none";


    updateScreen();

}


/* =================================================
   プレイヤーUI
================================================= */

function createPlayersUI() {

    const container =
        document.getElementById(
            "players"
        );


    container.innerHTML = "";


    players.forEach(
        (player, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "playerRow";


            row.innerHTML = `

                <div
                    class="
                    playerColor
                    player${index + 1}Color
                    ">
                </div>

                <div>
                    プレイヤー${index + 1}
                </div>

            `;


            container.appendChild(row);

        }
    );

}


/* =================================================
   プレイヤーコマ
================================================= */

function createPlayerMarkers() {

    players.forEach(
        (player, index) => {

            const icon =
                L.divIcon({

                    className: "",

                    html:
                        `<div class="
                        player-token
                        player${index + 1}
                        "></div>`,

                    iconSize:
                        [32, 32],

                    iconAnchor:
                        [16, 16]

                });


            player.marker =
                L.marker(
                    spaces[0],
                    {
                        icon: icon,
                        zIndexOffset:
                            1000 + index
                    }
                ).addTo(map);

        }
    );

}


/* =================================================
   画面更新
================================================= */

function updateScreen() {

    document
        .getElementById(
            "turnDisplay"
        )
        .textContent =
            players[currentPlayer].name
            + "のターン";

}


/* =================================================
   サイコロ
================================================= */

const diceImage =
    document.getElementById(
        "diceImage"
    );


const diceButton =
    document.getElementById(
        "diceButton"
    );


diceButton.addEventListener(
    "click",
    rollDice
);


async function rollDice() {

    diceButton.disabled = true;


    /* サイコロを振るアニメーション */

    diceImage.classList.add(
        "diceRolling"
    );


    /*
       約1秒間、
       サイコロ画像を高速切り替え
    */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const random =
            Math.floor(
                Math.random() * 6
            ) + 1;


        diceImage.src =
            "images/dice"
            + random
            + ".png";


        await wait(100);

    }


    /* 本当の出目 */

    const result =
        Math.floor(
            Math.random() * 6
        ) + 1;


    diceImage.classList.remove(
        "diceRolling"
    );


    diceImage.classList.add(
        "diceResult"
    );


    diceImage.src =
        "images/dice"
        + result
        + ".png";


    await wait(500);


    diceImage.classList.remove(
        "diceResult"
    );


    /* コマを移動 */

    await movePlayer(
        currentPlayer,
        result
    );


    /* ゴールしていなければ次へ */

    if (
        players[currentPlayer]
            .position <
        spaces.length - 1
    ) {

        currentPlayer++;

        if (
            currentPlayer >=
            players.length
        ) {

            currentPlayer = 0;

        }

        updateScreen();

        diceButton.disabled = false;

    }

}


/* =================================================
   プレイヤー移動
================================================= */

async function movePlayer(
    playerIndex,
    steps
) {

    const player =
        players[playerIndex];


    for (
        let i = 0;
        i < steps;
        i++
    ) {

        if (
            player.position >=
            spaces.length - 1
        ) {

            break;

        }


        player.position++;


        const lat =
            spaces[
                player.position
            ][0];


        const lng =
            spaces[
                player.position
            ][1];


        player.marker.setLatLng(
            [lat, lng]
        );


        await wait(300);

    }


    /* ゴール判定 */

    if (
        player.position >=
        spaces.length - 1
    ) {

        showGoal(
            playerIndex
        );

    }

}


/* =================================================
   待機
================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =================================================
   ゴール
================================================= */

function showGoal(
    playerIndex
) {

    document
        .getElementById(
            "goalScreen"
        )
        .style.display =
            "flex";


    document
        .getElementById(
            "goalMessage"
        )
        .textContent =
            players[playerIndex].name
            + "が佐渡を一周しました！";


    diceButton.disabled = true;

}


/* =================================================
   もう一度遊ぶ
================================================= */

document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

</script>

</body>
</html>

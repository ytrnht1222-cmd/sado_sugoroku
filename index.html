<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>佐渡すごろく</title>

    <!-- Leafletの地図を使うためのCSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        /* ページ全体 */
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        /* タイトル */
        h1 {
            margin: 0;
            padding: 12px;
            text-align: center;
            background: white;
        }

        /* 地図 */
        #map {
            width: 100%;
            height: 90vh;
        }

        /* サイコロ画面 */
        #gamePanel {
            position: absolute;
            z-index: 1000;
            top: 70px;
            left: 20px;

            width: 220px;
            padding: 15px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
        }

        /* サイコロ */
        #dice {
            font-size: 50px;
            text-align: center;
            margin: 10px;
        }

        /* ボタン */
        #diceButton {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #2e8b57;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #diceButton:hover {
            background: #246b45;
        }

        #diceButton:disabled {
            background: gray;
            cursor: not-allowed;
        }

        /* プレイヤー情報 */
        .player {
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
            background: #eeeeee;
        }

        .active {
            border: 3px solid #ffd700;
        }

        /* メッセージ */
        #message {
            margin-top: 10px;
            padding: 8px;
            line-height: 1.5;
        }

        /* 通常のマス */
        .space-number {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            background: white;
            border: 2px solid black;

            text-align: center;
            line-height: 28px;

            font-weight: bold;
        }

        /* 観光地のマス */
        .landmark {
            padding: 5px 8px;

            background: #fff4a3;
            border: 2px solid #d99b00;

            border-radius: 8px;

            font-weight: bold;
            white-space: nowrap;
        }

        /* プレイヤーの駒 */
        .player-token {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            color: white;
            text-align: center;
            line-height: 30px;

            font-weight: bold;

            border: 3px solid white;

            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .player1 {
            background: red;
        }

        .player2 {
            background: blue;
        }
    </style>
</head>

<body>

    <h1>🗾 佐渡すごろく</h1>

    <!-- ゲーム画面 -->
    <div id="map"></div>

    <!-- ゲーム操作パネル -->
    <div id="gamePanel">

        <div>
            <strong>現在のターン</strong>
        </div>

        <div id="turn">
            プレイヤー1
        </div>

        <div id="dice">
            ⚀
        </div>

        <button id="diceButton">
            🎲 サイコロを振る
        </button>

        <div class="player active" id="player1">
            🔴 プレイヤー1<br>
            現在：1番マス
        </div>

        <div class="player" id="player2">
            🔵 プレイヤー2<br>
            現在：1番マス
        </div>

        <div id="message">
            両津港からスタート！
        </div>

    </div>


    <!-- Leaflet本体 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        /*
        ========================================
        ① 40マスのデータ
        ========================================
        */

        const spaces = [

            // 1〜5
            { id: 1,  lat: 38.0776, lng: 138.4396, name: "両津港" },
            { id: 2,  lat: 38.0670, lng: 138.4350 },
            { id: 3,  lat: 38.0570, lng: 138.4300 },
            { id: 4,  lat: 38.0480, lng: 138.4260 },
            { id: 5,  lat: 38.0405, lng: 138.4230, name: "トキの森公園" },

            // 6〜10
            { id: 6,  lat: 38.0950, lng: 138.4300 },
            { id: 7,  lat: 38.1400, lng: 138.4350 },
            { id: 8,  lat: 38.1900, lng: 138.4450 },
            { id: 9,  lat: 38.2500, lng: 138.4600 },
            { id: 10, lat: 38.3260, lng: 138.4730, name: "大野亀" },

            // 11〜15
            { id: 11, lat: 38.2800, lng: 138.4300 },
            { id: 12, lat: 38.2200, lng: 138.3900 },
            { id: 13, lat: 38.1600, lng: 138.3400 },
            { id: 14, lat: 38.1000, lng: 138.2900 },
            { id: 15, lat: 38.0398, lng: 138.2508, name: "佐渡金山" },

            // 16〜20
            { id: 16, lat: 38.0300, lng: 138.2650 },
            { id: 17, lat: 38.0200, lng: 138.2800 },
            { id: 18, lat: 38.0100, lng: 138.2950 },
            { id: 19, lat: 38.0020, lng: 138.3100 },
            { id: 20, lat: 37.9950, lng: 138.3250, name: "大膳神社" },

            // 21〜25
            { id: 21, lat: 37.9920, lng: 138.3370 },
            { id: 22, lat: 37.9890, lng: 138.3500 },
            { id: 23, lat: 37.9870, lng: 138.3620 },
            { id: 24, lat: 37.9850, lng: 138.3730 },
            { id: 25, lat: 37.9828, lng: 138.3840, name: "妙宣寺" },

            // 26〜30
            { id: 26, lat: 37.9500, lng: 138.3700 },
            { id: 27, lat: 37.9100, lng: 138.3500 },
            { id: 28, lat: 37.8700, lng: 138.3300 },
            { id: 29, lat: 37.8350, lng: 138.3050 },
            { id: 30, lat: 37.8068, lng: 138.2815, name: "小木港" },

            // 31〜35
            { id: 31, lat: 37.8350, lng: 138.3300 },
            { id: 32, lat: 37.8700, lng: 138.3700 },
            { id: 33, lat: 37.9000, lng: 138.4100 },
            { id: 34, lat: 37.9350, lng: 138.4600 },
            { id: 35, lat: 37.9620, lng: 138.5040, name: "岩首昇竜棚田" },

            // 36〜40
            { id: 36, lat: 37.9850, lng: 138.5200 },
            { id: 37, lat: 38.0200, lng: 138.5100 },
            { id: 38, lat: 38.0500, lng: 138.4900 },
            { id: 39, lat: 38.0700, lng: 138.4650 },
            { id: 40, lat: 38.0776, lng: 138.4396, name: "両津港（ゴール）" }

        ];


        /*
        ========================================
        ② 佐渡の地図を作る
        ========================================
        */

        const map = L.map("map").setView(
            [38.05, 138.38],
            10
        );


        /*
        OpenStreetMapの地図を表示
        */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        /*
        ========================================
        ③ 40マスを地図に表示
        ========================================
        */

        spaces.forEach(function(space) {

            let icon;

            /*
            観光地の場合
            */
            if (space.name) {

                icon = L.divIcon({

                    className: "",

                    html:
                        `<div class="landmark">
                            ${space.id} ${space.name}
                        </div>`,

                    iconAnchor: [10, 15]

                });

            }

            /*
            普通のマスの場合
            */
            else {

                icon = L.divIcon({

                    className: "",

                    html:
                        `<div class="space-number">
                            ${space.id}
                        </div>`,

                    iconSize: [32, 32],

                    iconAnchor: [16, 16]

                });

            }


            /*
            マスを地図に追加
            */

            L.marker(
                [space.lat, space.lng],
                {
                    icon: icon
                }
            )
            .addTo(map);


        });


        /*
        ========================================
        ④ マスを赤い線でつなぐ
        ========================================
        */

        const route = spaces.map(function(space) {

            return [
                space.lat,
                space.lng
            ];

        });


        L.polyline(
            route,
            {
                color: "red",
                weight: 4
            }
        ).addTo(map);


        /*
        ========================================
        ⑤ プレイヤーを作る
        ========================================
        */

        const players = [

            {
                name: "プレイヤー1",
                position: 1,

                icon: L.divIcon({

                    className: "",

                    html:
                        `<div class="player-token player1">
                            1
                        </div>`,

                    iconSize: [36, 36],

                    iconAnchor: [18, 18]

                })
            },

            {
                name: "プレイヤー2",
                position: 1,

                icon: L.divIcon({

                    className: "",

                    html:
                        `<div class="player-token player2">
                            2
                        </div>`,

                    iconSize: [36, 36],

                    iconAnchor: [18, 18]

                })
            }

        ];


        /*
        プレイヤーを地図に配置
        */

        players.forEach(function(player) {

            player.marker = L.marker(

                [
                    spaces[0].lat,
                    spaces[0].lng
                ],

                {
                    icon: player.icon,
                    zIndexOffset: 1000
                }

            ).addTo(map);

        });


        /*
        ========================================
        ⑥ ゲームの状態
        ========================================
        */

        let currentPlayer = 0;

        let moving = false;


        /*
        サイコロの絵
        */

        const diceFaces = [

            "⚀",
            "⚁",
            "⚂",
            "⚃",
            "⚄",
            "⚅"

        ];


        /*
        ========================================
        ⑦ 画面を更新
        ========================================
        */

        function updateScreen() {

            /*
            プレイヤー1
            */

            document.getElementById(
                "player1"
            ).innerHTML =

                "🔴 プレイヤー1<br>" +
                "現在：" +
                players[0].position +
                "番マス";


            /*
            プレイヤー2
            */

            document.getElementById(
                "player2"
            ).innerHTML =

                "🔵 プレイヤー2<br>" +
                "現在：" +
                players[1].position +
                "番マス";


            /*
            現在のターン
            */

            document.getElementById(
                "turn"
            ).textContent =

                players[currentPlayer].name;


            /*
            黄色い枠
            */

            document
                .getElementById("player1")
                .classList.toggle(
                    "active",
                    currentPlayer === 0
                );


            document
                .getElementById("player2")
                .classList.toggle(
                    "active",
                    currentPlayer === 1
                );

        }


        /*
        ========================================
        ⑧ 少し待つための関数
        ========================================
        */

        function wait(ms) {

            return new Promise(

                function(resolve) {

                    setTimeout(
                        resolve,
                        ms
                    );

                }

            );

        }


        /*
        ========================================
        ⑨ プレイヤーを1マスずつ動かす
        ========================================
        */

        async function movePlayer(
            player,
            steps
        ) {

            for (
                let i = 0;
                i < steps;
                i++
            ) {

                /*
                次のマスへ
                */

                if (
                    player.position <
                    spaces.length
                ) {

                    player.position++;

                }


                /*
                次のマスの位置
                */

                const space =
                    spaces[
                        player.position - 1
                    ];


                /*
                駒を移動
                */

                player.marker.setLatLng([

                    space.lat,
                    space.lng

                ]);


                /*
                画面を更新
                */

                updateScreen();


                /*
                0.3秒待つ

                これによって
                「1マスずつ動く」
                ように見える
                */

                await wait(300);

            }

        }


        /*
        ========================================
        ⑩ サイコロボタン
        ========================================
        */

        document
            .getElementById("diceButton")
            .addEventListener(
                "click",
                async function() {


                    /*
                    すでに移動中なら何もしない
                    */

                    if (moving) {

                        return;

                    }


                    moving = true;


                    /*
                    ボタンを一時的に押せなくする
                    */

                    document
                        .getElementById(
                            "diceButton"
                        )
                        .disabled = true;


                    /*
                    1〜6の数字をランダムに作る
                    */

                    const roll =
                        Math.floor(
                            Math.random() * 6
                        ) + 1;


                    /*
                    サイコロを表示
                    */

                    document
                        .getElementById("dice")
                        .textContent =
                        diceFaces[
                            roll - 1
                        ];


                    /*
                    現在のプレイヤー
                    */

                    const player =
                        players[
                            currentPlayer
                        ];


                    /*
                    メッセージ
                    */

                    document
                        .getElementById("message")
                        .textContent =

                        player.name +
                        "は" +
                        roll +
                        "マス進みます！";


                    /*
                    ゴールを超えないようにする
                    */

                    const steps =
                        Math.min(

                            roll,

                            spaces.length -
                            player.position

                        );


                    /*
                    実際に移動
                    */

                    await movePlayer(
                        player,
                        steps
                    );


                    /*
                    到着したマス
                    */

                    const landedSpace =
                        spaces[
                            player.position - 1
                        ];


                    /*
                    ゴールした場合
                    */

                    if (
                        player.position ===
                        spaces.length
                    ) {

                        document
                            .getElementById(
                                "message"
                            )
                            .innerHTML =

                            "🎉 " +
                            player.name +
                            "がゴール！<br>" +
                            "佐渡を1周しました！";

                    }


                    /*
                    観光地に到着した場合
                    */

                    else if (
                        landedSpace.name
                    ) {

                        document
                            .getElementById(
                                "message"
                            )
                            .innerHTML =

                            "📍 " +
                            "<strong>" +
                            landedSpace.name +
                            "</strong>" +
                            "に到着！";

                    }


                    /*
                    普通のマス
                    */

                    else {

                        document
                            .getElementById(
                                "message"
                            )
                            .textContent =

                            player.name +
                            "は" +
                            player.position +
                            "番マスに到着しました。";

                    }


                    /*
                    ゴールしていなければ
                    次のプレイヤーへ
                    */

                    if (
                        player.position <
                        spaces.length
                    ) {

                        currentPlayer =
                            (currentPlayer + 1)
                            % players.length;

                    }


                    /*
                    画面更新
                    */

                    updateScreen();


                    /*
                    ボタンを再び押せるようにする
                    */

                    moving = false;

                    document
                        .getElementById(
                            "diceButton"
                        )
                        .disabled = false;

                }
            );


        /*
        最初の画面を表示
        */

        updateScreen();

    </script>

</body>
</html>

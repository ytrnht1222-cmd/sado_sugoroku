<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>佐渡すごろく</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        /* =========================
           全体
        ========================= */

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        /* 地図 */
        #map {
            height: 90vh;
            width: 100%;
        }


        /* =========================
           ゲーム画面
        ========================= */

        #gamePanel {
            position: absolute;
            top: 10px;
            left: 10px;

            z-index: 1000;

            background: rgba(255,255,255,0.95);

            padding: 15px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.25);

            min-width: 230px;
        }


        /* 現在のプレイヤー */
        #turnDisplay {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 10px;
        }


        /* =========================
           サイコロ
        ========================= */

        #dice {
            font-size: 70px;

            text-align: center;

            margin: 10px 0;

            /* アニメーション */
            transition: transform 0.1s;
        }


        /* サイコロを振っているとき */
        .rolling {
            animation: diceRoll 0.12s infinite;
        }


        /* サイコロの動き */
        @keyframes diceRoll {

            0% {
                transform: rotate(-15deg) scale(1);
            }

            25% {
                transform: rotate(15deg) scale(1.15);
            }

            50% {
                transform: rotate(-10deg) scale(0.9);
            }

            75% {
                transform: rotate(10deg) scale(1.15);
            }

            100% {
                transform: rotate(-15deg) scale(1);
            }

        }


        /* サイコロボタン */
        #diceButton {

            width: 100%;

            padding: 12px;

            font-size: 20px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            background: #ffcc33;

            cursor: pointer;

            transition: 0.2s;
        }


        #diceButton:hover {
            background: #ffb700;

            transform: scale(1.03);
        }


        #diceButton:active {
            transform: scale(0.95);
        }


        /* サイコロを振っている間 */
        #diceButton:disabled {

            background: #cccccc;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           プレイヤー情報
        ========================= */

        .playerRow {

            margin-top: 8px;

            padding: 8px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;
        }


        .player1 {
            background: #ffdddd;
        }


        .player2 {
            background: #ddddff;
        }


        /* =========================
           マス番号
        ========================= */

        .space-number {

            background: white;

            border: 2px solid #333;

            border-radius: 50%;

            width: 24px;

            height: 24px;

            text-align: center;

            line-height: 24px;

            font-size: 12px;

            font-weight: bold;
        }


        /* =========================
           ランドマーク
        ========================= */

        .landmark {

            background: #ffd700;

            border: 3px solid #ff9900;

            border-radius: 50%;

            width: 34px;

            height: 34px;

            text-align: center;

            line-height: 34px;

            font-size: 13px;

            font-weight: bold;

        }


        /* =========================
           プレイヤーのコマ
        ========================= */

        .player-token {

            border-radius: 50%;

            width: 28px;

            height: 28px;

            border: 3px solid white;

            box-shadow: 0 2px 6px rgba(0,0,0,0.4);

        }


        .player1-token {
            background: red;
        }


        .player2-token {
            background: blue;
        }


        /* =========================
           到着時の強調
        ========================= */

        .landmark-arrival {

            animation: landmarkArrival 0.8s ease;

        }


        @keyframes landmarkArrival {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.7);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ゲーム情報
         ========================= -->

    <div id="gamePanel">

        <div id="turnDisplay">
            プレイヤー1のターン
        </div>


        <!-- サイコロ -->

        <div id="dice">
            ⚀
        </div>


        <button id="diceButton">
            🎲 サイコロを振る
        </button>


        <div class="playerRow player1">
            🔴 プレイヤー1
        </div>


        <div class="playerRow player2">
            🔵 プレイヤー2
        </div>

    </div>


    <!-- =========================
         地図
         ========================= -->

    <div id="map"></div>


    <!-- Leaflet -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        /* ==================================================
           ① 佐渡の地図を作る
           ================================================== */

        const map = L.map("map").setView(
            [38.05, 138.38],
            10
        );


        /* OpenStreetMap */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);



        /* ==================================================
           ② すごろくの40マス
           ================================================== */

        const spaces = [

            {name:"両津港", lat:38.0776, lng:138.4396},

            {lat:38.0670, lng:138.4350},

            {lat:38.0570, lng:138.4300},

            {lat:38.0480, lng:138.4260},

            {name:"トキの森公園", lat:38.0405, lng:138.4230},

            {lat:38.0950, lng:138.4300},

            {lat:38.1400, lng:138.4350},

            {lat:38.1900, lng:138.4450},

            {lat:38.2500, lng:138.4600},

            {name:"大野亀", lat:38.3260, lng:138.4730},

            {lat:38.2800, lng:138.4300},

            {lat:38.2200, lng:138.3900},

            {lat:38.1600, lng:138.3400},

            {lat:38.1000, lng:138.2900},

            {name:"佐渡金山", lat:38.0398, lng:138.2508},

            {lat:38.0300, lng:138.2650},

            {lat:38.0200, lng:138.2800},

            {lat:38.0100, lng:138.2950},

            {lat:38.0020, lng:138.3100},

            {name:"大膳神社", lat:37.9950, lng:138.3250},

            {lat:37.9920, lng:138.3370},

            {lat:37.9890, lng:138.3500},

            {lat:37.9870, lng:138.3620},

            {lat:37.9850, lng:138.3730},

            {name:"妙宣寺", lat:37.9828, lng:138.3840},

            {lat:37.9500, lng:138.3700},

            {lat:37.9100, lng:138.3500},

            {lat:37.8700, lng:138.3300},

            {lat:37.8350, lng:138.3050},

            {name:"小木港", lat:37.8068, lng:138.2815},

            {lat:37.8350, lng:138.3300},

            {lat:37.8700, lng:138.3700},

            {lat:37.9000, lng:138.4100},

            {lat:37.9350, lng:138.4600},

            {name:"岩首昇竜棚田", lat:37.9620, lng:138.5040},

            {lat:37.9850, lng:138.5200},

            {lat:38.0200, lng:138.5100},

            {lat:38.0500, lng:138.4900},

            {lat:38.0700, lng:138.4650},

            {name:"両津港（ゴール）", lat:38.0776, lng:138.4396}

        ];



        /* ==================================================
           ③ すごろくのルートを線で表示
           ================================================== */

        const route = spaces.map(
            space => [space.lat, space.lng]
        );


        L.polyline(
            route,
            {
                color: "red",
                weight: 5,
                opacity: 0.7
            }
        ).addTo(map);



        /* ==================================================
           ④ マスを地図に表示
           ================================================== */

        spaces.forEach((space, index) => {

            let icon;


            /* ランドマーク */

            if (space.name) {

                icon = L.divIcon({

                    className: "",

                    html:
                        `<div class="landmark">
                            ${index + 1}
                         </div>`,

                    iconSize: [34,34],

                    iconAnchor: [17,17]

                });

            }


            /* 普通のマス */

            else {

                icon = L.divIcon({

                    className: "",

                    html:
                        `<div class="space-number">
                            ${index + 1}
                         </div>`,

                    iconSize: [24,24],

                    iconAnchor: [12,12]

                });

            }


            const marker = L.marker(
                [space.lat, space.lng],
                {icon: icon}
            ).addTo(map);


            /* ランドマークなら名前を表示 */

            if (space.name) {

                marker.bindTooltip(
                    space.name,
                    {
                        permanent: true,
                        direction: "top",
                        offset: [0,-15]
                    }
                );

            }

        });



        /* ==================================================
           ⑤ プレイヤー
           ================================================== */

        const players = [

            {
                name: "プレイヤー1",

                position: 0,

                color: "red",

                marker: null

            },

            {
                name: "プレイヤー2",

                position: 0,

                color: "blue",

                marker: null

            }

        ];



        /* ==================================================
           ⑥ プレイヤーのコマを作る
           ================================================== */

        players.forEach((player, index) => {

            const icon = L.divIcon({

                className: "",

                html:
                    `<div class="player-token player${index + 1}-token">
                    </div>`,

                iconSize: [34,34],

                iconAnchor: [17,17]

            });


            player.marker = L.marker(

                [
                    spaces[0].lat,
                    spaces[0].lng
                ],

                {
                    icon: icon,
                    zIndexOffset: 1000 + index
                }

            ).addTo(map);

        });



        /* ==================================================
           ⑦ 現在のターン
           ================================================== */

        let currentPlayer = 0;



        /* ==================================================
           ⑧ サイコロの絵
           ================================================== */

        const diceFaces = [

            "⚀",

            "⚁",

            "⚂",

            "⚃",

            "⚄",

            "⚅"

        ];



        /* ==================================================
           ⑨ HTML要素を取得
           ================================================== */

        const dice = document.getElementById("dice");

        const diceButton =
            document.getElementById("diceButton");

        const turnDisplay =
            document.getElementById("turnDisplay");



        /* ==================================================
           ⑩ 待つための関数
           ================================================== */

        function wait(ms) {

            return new Promise(
                resolve => setTimeout(resolve, ms)
            );

        }



        /* ==================================================
           ⑪ 画面更新
           ================================================== */

        function updateScreen() {

            turnDisplay.textContent =
                players[currentPlayer].name +
                "のターン";

        }



        /* ==================================================
           ⑫ サイコロを振るアニメーション
           ================================================== */

        async function rollDice() {

            /* ボタンを押せなくする */

            diceButton.disabled = true;


            /* サイコロを回転させる */

            dice.classList.add("rolling");


            /* 仮の数字を高速で表示 */

            const animationTime = 1000;

            const startTime = Date.now();


            while (
                Date.now() - startTime <
                animationTime
            ) {

                const randomFace =
                    Math.floor(
                        Math.random() * 6
                    );


                dice.textContent =
                    diceFaces[randomFace];


                await wait(100);

            }


            /* 本当の出目 */

            const result =
                Math.floor(
                    Math.random() * 6
                ) + 1;


            /* アニメーション停止 */

            dice.classList.remove("rolling");


            /* 最終結果を表示 */

            dice.textContent =
                diceFaces[result - 1];


            /* 少し間をあける */

            await wait(500);


            return result;

        }



        /* ==================================================
           ⑬ プレイヤーを1マスずつ移動
           ================================================== */

        async function movePlayer(
            player,
            steps
        ) {

            for (
                let i = 0;
                i < steps;
                i++
            ) {

                /* 次のマスへ */

                if (
                    player.position <
                    spaces.length - 1
                ) {

                    player.position++;

                }


                /* コマを移動 */

                player.marker.setLatLng([

                    spaces[player.position].lat,

                    spaces[player.position].lng

                ]);


                /* 移動するたびに少し待つ */

                await wait(300);

            }

        }



        /* ==================================================
           ⑭ ランドマーク到着演出
           ================================================== */

        function landmarkEffect(
            position
        ) {

            const space =
                spaces[position];


            if (!space.name) {
                return;
            }


            /* メッセージ */

            alert(
                "📍 " +
                space.name +
                " に到着！"
            );

        }



        /* ==================================================
           ⑮ サイコロボタン
           ================================================== */

        diceButton.addEventListener(
            "click",

            async function() {

                const player =
                    players[currentPlayer];


                /* サイコロを振る */

                const result =
                    await rollDice();


                /* 結果をコンソールにも表示 */

                console.log(
                    player.name +
                    "の出目：" +
                    result
                );


                /* コマを移動 */

                await movePlayer(
                    player,
                    result
                );


                /* ランドマークなら演出 */

                landmarkEffect(
                    player.position
                );


                /* ゴール */

                if (
                    player.position ===
                    spaces.length - 1
                ) {

                    alert(
                        "🎉 " +
                        player.name +
                        " が佐渡を1周しました！"
                    );


                    diceButton.disabled = true;

                    return;

                }


                /* 次のプレイヤーへ */

                currentPlayer =
                    (currentPlayer + 1)
                    % players.length;


                updateScreen();


                /* ボタンを再び押せるようにする */

                diceButton.disabled = false;

            }

        );


        /* ==================================================
           ⑯ 最初の画面
           ================================================== */

        updateScreen();

    </script>

</body>

</html>
